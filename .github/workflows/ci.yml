name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-sota.txt || echo "implicit optional, skipped"
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check recoforge tests
          ruff format --check recoforge tests

      - name: Test (pytest)
        run: pytest tests/ -q -W ignore::UserWarning -W ignore::RuntimeWarning

      - name: Demo smoke (determinism + benchmark.json)
        run: python -m recoforge.examples.run_demo --seed 42 --out benchmark.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
